name: "Jabra Double Clap"
version: "1.0.0"
slug: "jabra_clap"
description: "Erkennt Doppelklatschen über einen Jabra-Link und sendet ein Home-Assistant-Event."
url: "https://github.com/shdtfy/jabra-clap-ha"
stage: experimental
startup: application
boot: auto
init: false
audio: true
homeassistant_api: true

arch:
  - aarch64
  - amd64

options:
  device_match: "Jabra Link 390"
  peak_threshold: 0.30
  rms_threshold: 0.035
  rise_factor: 2.5
  min_gap_ms: 180
  max_gap_ms: 850
  cooldown_ms: 1800

schema:
  device_match: str
  peak_threshold: float
  rms_threshold: float
  rise_factor: float
  min_gap_ms: int
  max_gap_ms: int
  cooldown_ms: int
