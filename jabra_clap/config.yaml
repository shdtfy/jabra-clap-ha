name: "Jabra Double Clap"
version: "1.0.2"
slug: "jabra_clap"
description: "Erkennt Doppelklatschen über einen Jabra-Link und triggert einen lokalen Home-Assistant-Webhook."
url: "https://github.com/shdtfy/jabra-clap-ha"
stage: experimental
startup: application
boot: auto
init: false
audio: true

arch:
  - aarch64
  - amd64

options:
  device_match: "Jabra Link 390"
  peak_threshold: 0.30
  rms_threshold: 0.035
  rise_factor: 2.5
  min_gap_ms: 180
  max_gap_ms: 850
  cooldown_ms: 1800
  webhook_id: "jabra_double_clap_J1K1Tg2X4Y5v3aOoyLCQ7WJe"

schema:
  device_match: str
  peak_threshold: float
  rms_threshold: float
  rise_factor: float
  min_gap_ms: int
  max_gap_ms: int
  cooldown_ms: int
  webhook_id: str
