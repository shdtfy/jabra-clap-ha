name: "Double Clap"
version: "1.1.1"
slug: "jabra_clap"
description: "Lokale Doppelklatsch-Erkennung für Home Assistant • entwickelt von Filo Mahlich"
url: "https://github.com/shdtfy/jabra-clap-ha"
stage: experimental
startup: application
boot: auto
init: false
audio: true

arch:
  - aarch64
  - amd64

options:
  device_match: "auto"
  peak_threshold: 0.55
  rms_threshold: 0.08
  rise_factor: 3.5
  min_crest_factor: 3.4
  min_sharpness: 0.55
  max_pulse_ms: 120
  min_gap_ms: 180
  max_gap_ms: 650
  cooldown_ms: 2500
  webhook_id: null

schema:
  device_match: str
  peak_threshold: float
  rms_threshold: float
  rise_factor: float
  min_crest_factor: float
  min_sharpness: float
  max_pulse_ms: int
  min_gap_ms: int
  max_gap_ms: int
  cooldown_ms: int
  webhook_id: password
